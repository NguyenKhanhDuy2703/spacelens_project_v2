name: trivy security scan worker
on:
    workflow_call:
        inputs:
            image-tag:
                description: "Image tag to scan"
                required: true
                type: string
            services:
                description: "JSON array of service names to scan"
                required: true
                type: string
                default: '["spacelens-be", "spacelens-fe", "spacelens-ai-analytics", "spacelens-ai-tracking"]'
        secrets:
            DOCKER_USERNAME:
                required: false
            DOCKER_PASSWORD:
                required: false
jobs:
    scan-matrix:
        name: "Scan ${{ matrix.services-json }}"
        runs-on: ubuntu-latest
        env:
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
            DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        strategy:
            fail-fast: false
            matrix:
                services-json: ${{ fromJson(inputs.services) }}

        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Login to Docker Hub
              if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Ensure .trivyignore exists (create empty if missing)
              run: |
                SERVICE_MAP='{"spacelens-be":"MODULE_BE","spacelens-fe":"MODULE_FE","spacelens-ai-analytics":"MODULE_AI/analytics_service","spacelens-ai-tracking":"MODULE_AI/tracking_service"}'
                SERVICE_PATH=$(echo $SERVICE_MAP | python3 -c "import sys,json; m=json.load(sys.stdin); print(m.get('${{ matrix.services-json }}',''))")
                if [ -n "$SERVICE_PATH" ] && [ ! -f "$SERVICE_PATH/.trivyignore" ]; then
                  echo "# Auto-generated empty trivyignore" > "$SERVICE_PATH/.trivyignore"
                  echo "Created empty .trivyignore at $SERVICE_PATH/.trivyignore"
                fi

            - name: Run Trivy Vulnerability Scan (CRITICAL & HIGH Gate)
              uses: aquasecurity/trivy-action@master
              with:
                image-ref: "${{ env.DOCKER_USERNAME || 'spacelens' }}/${{ matrix.services-json }}:${{ inputs.image-tag }}"
                format: table
                severity: CRITICAL,HIGH
                exit-code: "1"
                ignore-unfixed: true