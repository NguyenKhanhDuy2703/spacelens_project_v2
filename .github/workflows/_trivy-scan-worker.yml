name: Trivy Security Scan Worker

on:
  workflow_call:
    inputs:
      image-tag:
        description: "Image tag to scan"
        required: true
        type: string
      services:
        description: "JSON array of service names to scan"
        required: false
        type: string
        default: '["spacelens-be", "spacelens-fe", "spacelens-ai-analytics", "spacelens-ai-tracking"]'
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false

jobs:
  scan-matrix:
    name: "Scan ${{ matrix.services-json }}"
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        services-json: ${{ fromJson(inputs.services) }}

    steps:
      - name: Login to Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Run Trivy Vulnerability Scan (CRITICAL & HIGH Gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ secrets.DOCKER_USERNAME || 'spacelens' }}/${{ matrix.services-json }}:${{ inputs.image-tag }}"
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          output: table
          ignore-unfixed: true