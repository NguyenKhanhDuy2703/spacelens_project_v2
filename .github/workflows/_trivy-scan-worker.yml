name : trivy security scan worker
on:
    workflow_call:
        inputs:
            image-tag:
                description: "Image tag to scan"
                required: true
                type: string
            services:
                description: ""
                required: true
                type: string
                default: '["spacelens-be", "spacelens-fe", "spacelens-ai-analytics", "spacelens-ai-tracking"]'
        outputs:
            scan-result:
                description: "Scan result"
                value: ${{ jobs.scan.outputs.scan-result }}
        secrets:
            DOCKER_USERNAME:
                required: false
            DOCKER_PASSWORD:
                required: false
jobs:
    scan-matrix:
        name: "Scan ${{matrix.services-json}}"
        runs-on: ubuntu-latest
        env:
            DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
            DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        strategy:
            fail-fast: false
            matrix:
                services-json: ${{ fromJson(inputs.services) }}
                
        steps:
            - name: Login to Docker Hub
              if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}
            
            - name : scan tryvi
              uses : aquasecurity/trivy-action@master
              with: 
                image-ref: "${{ secrets.DOCKER_USERNAME || 'spacelens' }}/${{ matrix.services-json }}:${{ inputs.image-tag }}"
                format: table
                severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
                exit-code: "1"
                output: table
                ignore-unfixed: true

    scan-report: 
            name: "Genera report"
            needs: [scan-matrix]
            runs-on: ubuntu-latest
            if: always()
            steps:
                - name : valuate result 
                  run: |
                    FAILED_SCANS=$(grep "Failed:" ${{runner.temp}}/trivy-results/*.txt | wc -l)
                    if [ "$FAILED_SCANS" -gt 0 ]; then
                      echo "Scan failed on $FAILED_SCANS images. Aborting." >&2
                      exit 1
                    else
                      echo "All scans completed successfully."
                    fi