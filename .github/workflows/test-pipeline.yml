name: test pipeline

on:
  push:
    branches:
      - "feat/**"
      - "fix/**"
      - "ci-cd"
      - "dev"
      - "main"
    paths:
      - "MODULE_FE/**"
      - "MODULE_BE/**"
      - ".github/workflows/**"
  pull_request:
    branches:
      - "dev"
      - "staging"
      - "main"
    paths:
      - "MODULE_FE/**"
      - "MODULE_BE/**"
      - ".github/workflows/**"

jobs:
  be-unit-tests:
    name: "Backend Unit Test Worker"
    uses: ./.github/workflows/_be-test-worker.yml
    with:
      node-version: "20"

  fe-unit-tests:
    name: "Frontend Unit Test Worker"
    uses: ./.github/workflows/_fe-test-worker.yml
    with:
      node-version: "20"
