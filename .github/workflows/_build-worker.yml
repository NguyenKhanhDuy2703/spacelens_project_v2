name: Reusable Build Worker

on:
  workflow_call:
    inputs:
      service-name:
        description: "Name of the target service"
        required: true
        type: string
      service-path:
        description: "Context directory of the service"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile relative to service-path"
        required: false
        default: "Dockerfile"
        type: string
      language:
        description: "Runtime language/ecosystem of the service (node, python, etc.)"
        required: true
        type: string
      push-image:
        description: "Whether to push the built container image to registry"
        required: false
        default: false
        type: boolean
    secrets:
      DOCKER_USERNAME:
        required: false
      DOCKER_PASSWORD:
        required: false
    outputs:
      image-tag:
        description: "Built image tag"
        value: ${{ jobs.build.outputs.image-tag }}

jobs:
  build:
    name: "Build Container (${{ inputs.service-name }} / ${{ inputs.language }})"
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.image-tag }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Hub Credentials
        id: auth-check
        run: |
          if [ -n "${{ secrets.DOCKER_USERNAME }}" ] && [ -n "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "has_auth=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_auth=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: inputs.push-image && steps.auth-check.outputs.has_auth == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate Metadata & Tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          REGISTRY_PREFIX="${{ secrets.DOCKER_USERNAME }}"
          if [ -z "$REGISTRY_PREFIX" ]; then
            REGISTRY_PREFIX="spacelens"
          fi
          IMAGE_TAG="${REGISTRY_PREFIX}/${{ inputs.service-name }}:${SHORT_SHA}"
          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "short-sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service-path }}
          file: ${{ inputs.service-path }}/${{ inputs.dockerfile }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.image-tag }}
          labels: |
            org.opencontainers.image.title=${{ inputs.service-name }}
            org.opencontainers.image.language=${{ inputs.language }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.service-name }}-${{ inputs.language }}
          cache-to: type=gha,mode=max,scope=${{ inputs.service-name }}-${{ inputs.language }}

      - name: Run Trivy Vulnerability Scan(critial & high)
        uses: aquasecurity/trivy-action@master
        with: 
          image-ref: ${{ steps.meta.outputs.image-tag }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          output: table
          ignore-unfixed: true
      - name: push docker image to registry
        if : inputs.push-image && steps.auth-check.outputs.has_auth == 'true'
        run: |
          docker push ${{ steps.meta.outputs.image-tag }}
          